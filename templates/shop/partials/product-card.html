{% load static %}
<div class="shadow-md bg-white group/product hover:ring hover:ring-primary-soft rounded-lg overflow-hidden relative">
    <div class="aspect-square bg-greenGray-100 flex items-center justify-center overflow-hidden">
        {% if image %}
        <img class="w-full h-full object-cover" src="{% static image %}" alt="{{ title }}">
        {% else %}
        <div class="w-full h-full bg-gradient-to-br from-greenGray-100 to-greenGray-200" aria-hidden="true"></div>
        {% endif %}
    </div>
    <div class="p-6">
        <div class="flex justify-between items-center gap-3">
            <div>
                <h3 class="text-primary-hard text-lg font-semibold capitalize">{{ title }}</h3>
                <div class="mt-1 flex items-baseline gap-2">
                    <span class="text-greenGray-600 text-lg font-semibold">${{ price }}</span>
                    {% if original_price %}
                    <span class="line-through text-gray-400 text-sm">${{ original_price }}</span>
                    {% endif %}
                </div>
                <div class="flex items-center mt-2 space-x-0.5">
                    {% for i in "12345" %}
                    <svg class="w-4 h-4 {% if forloop.counter <= rating %}text-warning{% else %}text-gray-200{% endif %}" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 20" aria-hidden="true">
                        <path d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z"/>
                    </svg>
                    {% endfor %}
                </div>
            </div>
            <button type="button" class="p-4 items-center group-hover/product:bg-primary bg-greenGray-200 rounded-full shrink-0 transition-colors">
                <svg class="w-6 h-6 text-gray-800 group-hover/product:text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 20" aria-hidden="true">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9V4a3 3 0 0 0-6 0v5m9.92 10H2.08a1 1 0 0 1-1-1.077L2 6h14l.917 11.923A1 1 0 0 1 15.92 19Z"/>
                </svg>
                <span class="sr-only">Add {{ title }} to cart</span>
            </button>
        </div>
    </div>
    <div class="absolute top-4 right-4 hidden group-hover/product:block">
        <button type="button" class="bg-white/90 rounded-full p-2 shadow-sm">
            <svg class="w-5 h-5 text-gray-800 hover:text-primary" viewBox="0 0 21 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 4C5.5-1.5-1.5 5.5 4 11l7 7 7-7c5.458-5.458-1.542-12.458-7-7Z"/>
            </svg>
            <span class="sr-only">Add to wishlist</span>
        </button>
    </div>
</div>
